    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        registration_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          example: 50000
        status:
          type: string
          enum: [WAITING, PAID, FAILED, REFUNDED]
        provider:
          type: string
          enum: [IPAYMU, MANUAL]
        transaction_id:
          type: string
        payment_method:
          type: string
          example: QRIS
        payment_channel:
          type: string
          example: BCA
        payment_url:
          type: string
          description: Hosted checkout link (IPAYMU provider only)
        proof_url:
          type: string
          description: Manual transfer proof (MANUAL provider only)
        bank_name:
          type: string
          description: Only populated for MANUAL provider checkout
        bank_account_number:
          type: string
        bank_account_holder:
          type: string
        expired_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentDetailResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/Payment"

