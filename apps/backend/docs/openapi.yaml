        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ─── Event Schemas ────────────────────────────────────────────────────────
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
