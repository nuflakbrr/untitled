          type: string
        description:
          type: string
          nullable: true
        image_url:
          type: string
        featured:
          type: boolean
        event_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GalleryRequest:
      type: object
      required:
        - title
