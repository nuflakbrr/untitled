openapi: 3.0.3
info:
  title: SITIVENT Multi-Tenant API
  description: |
    # Sistem Informasi & Manajemen Event Universitas (SITIVENT)
    REST API Backend Polyglot Go (Gin) dengan arsitektur Hierarchical Multi-Tenant (Rektorat & Fakultas) dan Permission-Based Access Control (PBAC).

    ### Struktur Multi-Tenant:
    1. **Tenant Utama (Rektorat / Universitas)**: `type = ROOT`, `parent_id = NULL`. Mengelola seluruh tenant dan event tingkat universitas.
    2. **Tenant Children (Fakultas / Unit Kerja)**: `type = FACULTY`, `parent_id = <ID_Rektorat>`. Mengelola event, panitia, kuota, pembayaran, dan absensi khusus fakultas.
    3. **Peserta Universal**: Akun mahasiswa/umum (`role = peserta`, `tenant_id = NULL`) yang dapat mendaftar ke event lintas fakultas dan rektorat.
  version: 1.0.0
  contact:
    name: Naufal Akbar Nugroho
    email: naufalakbar378@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local Development Server

tags:
  - name: Health
    description: Health check dan status operasional sistem
  - name: Core - Auth
    description: Otentikasi JWT, registrasi peserta, login, dan perpindahan konteks tenant
  - name: Core - Tenants
    description: Manajemen tenant fakultas dan konfigurasi payment gateway per fakultas
  - name: Core - Users
    description: Manajemen data pengguna, panitia, scanner, dan kontrol status banned
  - name: Core - Roles & Permissions
    description: Manajemen jabatan dan hak akses PBAC (Permission-Based Access Control)
  - name: Core - Audit Logs
    description: Audit trail aktivitas administratif dan keamanan sistem
  - name: Modules - Events
    description: Manajemen katalog event fakultas dan universitas
  - name: Modules - Event Categories
    description: Kategori event per fakultas dan kategori global rektorat
  - name: Modules - Registrations
    description: Pendaftaran peserta event dan penerbitan tiket QR Code
  - name: Modules - Payments
    description: Transaksi pembayaran manual & iPaymu per-fakultas serta verifikasi bukti transfer
  - name: Modules - Attendance
    description: Pemindaian QR Code kehadiran dan riwayat presensi
  - name: Modules - Certificates
    description: Template sertifikat dinamis dan pengunduhan sertifikat peserta
  - name: Modules - Articles
    description: Berita, kabar fakultas, dan panduan akademik
  - name: Modules - Galleries
    description: Dokumentasi dan galeri foto kegiatan event kampus
  - name: Modules - Support Messages
    description: Layanan bantuan dan pesan dukungan dari peserta

paths:
  # ============================================================================
  # HEALTH CHECK
  # ============================================================================
  /health:
    get:
      tags:
        - Health
      summary: Health check server
      description: Memeriksa apakah service API berjalan normal
      responses:
        "200":
          description: Service sehat dan beroperasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: SITIVENT API is running

  # ============================================================================
  # CORE - AUTHENTICATION
  # ============================================================================
  /core/v1/auth/signup:
    post:
      tags:
        - Core - Auth
      summary: Registrasi Peserta Mandiri (Universal)
      description: "Mendaftarkan akun peserta umum/mahasiswa baru. Otomatis mendapatkan role 'peserta' dan 'tenant_id: null'."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Berhasil registrasi akun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /core/v1/auth/signin:
    post:
      tags:
        - Core - Auth
      summary: Login Akun Pengguna
      description: Otentikasi dengan email & password. Mengembalikan JWT access token dengan konteks tenant dan daftar permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /core/v1/auth/refresh:
    post:
      tags:
        - Core - Auth
      summary: Refresh Access Token
      description: Memperbarui access token yang telah kedaluwarsa menggunakan refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /core/v1/auth/me:
    get:
      tags:
        - Core - Auth
      summary: Get Profil & Konteks Tenant Pengguna
      description: Mengambil data pengguna yang sedang login beserta peran, daftar hak akses (permissions), dan tenant yang sedang aktif.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Data profil berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /core/v1/auth/switch-tenant:
    post:
      tags:
        - Core - Auth
      summary: Beralih Konteks Tenant (Root Superadmin Only)
      description: "Khusus akun Superadmin Universitas (Rektorat) untuk berpindah konteks administrasi ke fakultas tertentu (fasilkom, teknik, dll.) dan memperoleh JWT token baru."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchTenantRequest"
      responses:
        "200":
          description: Konteks tenant berhasil dialihkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  # ============================================================================
  # CORE - TENANT MANAGEMENT
  # ============================================================================
  /core/v1/tenants:
    get:
      tags:
        - Core - Tenants
      summary: List Semua Tenant / Fakultas
      description: Mengambil seluruh daftar tenant fakultas dan rektorat. Digunakan untuk dropdown katalog dan manajemen unit kerja.
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [ROOT, FACULTY, DEPARTMENT, UNIT]
          description: Filter berdasarkan tipe tenant
        - in: query
          name: search
          schema:
            type: string
          description: Pencarian nama atau kode tenant
      responses:
        "200":
          description: Daftar tenant berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
    post:
      tags:
        - Core - Tenants
      summary: Tambah Tenant Fakultas Baru
      description: "Menambahkan fakultas atau unit kerja baru ke dalam sistem. Wajib memiliki izin 'tenant.create'."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant baru berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /core/v1/tenants/{id}:
    get:
      tags:
        - Core - Tenants
      summary: Detail Tenant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail tenant ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags:
        - Core - Tenants
      summary: Update Data Tenant Fakultas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Data tenant berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
        - Core - Tenants
      summary: Hapus Tenant Fakultas
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /core/v1/tenants/by-slug/{slug}:
    get:
      tags:
        - Core - Tenants
      summary: Detail Tenant by Slug
      description: "Mengambil data profil tenant berdasarkan slug publik (contoh: fasilkom, teknik, rektorat)."
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            example: fasilkom
      responses:
        "200":
          description: Profil tenant ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /core/v1/tenants/{id}/payment-gateway:
    get:
      tags:
        - Core - Tenants
      summary: Get Konfigurasi Payment Gateway Tenant
      description: Mengambil kredensial iPaymu dan rekening bank manual khusus fakultas/rektorat tersebut.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Konfigurasi payment gateway tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentGatewayDetailResponse"
    put:
      tags:
        - Core - Tenants
      summary: Update Konfigurasi Payment Gateway Tenant
      description: Mengatur API Key iPaymu, nomor VA, environment (sandbox/production), dan rekening bank manual fakultas.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentGatewayRequest"
      responses:
        "200":
          description: Konfigurasi payment gateway berhasil disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentGatewayDetailResponse"

  # ============================================================================
  # CORE - USER MANAGEMENT
  # ============================================================================
  /core/v1/users:
    get:
      tags:
        - Core - Users
      summary: List Data Pengguna (Tenant-Scoped)
      description: Mengambil daftar pengguna dengan filter role, status banned, dan tenant fakultas masing-masing.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: role
          schema:
            type: string
            enum: [root_superadmin, superadmin, panitia, scanner, peserta]
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Daftar pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPaginatedResponse"
    post:
      tags:
        - Core - Users
      summary: Buat Akun Pengguna Baru (Superadmin)
      description: Membuat akun panitia, scanner, atau admin fakultas baru oleh Superadmin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"

  /core/v1/users/{id}:
    get:
      tags:
        - Core - Users
      summary: Detail Pengguna by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail user ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags:
        - Core - Users
      summary: Update Pengguna by ID
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"

  /core/v1/users/{id}/ban:
    post:
      tags:
        - Core - Users
      summary: Blokir / Ban Akun Pengguna
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUserRequest"
      responses:
        "200":
          description: Akun berhasil diblokir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  /core/v1/users/{id}/unban:
    post:
      tags:
        - Core - Users
      summary: Buka Blokir / Unban Akun Pengguna
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Blokir akun berhasil dibuka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  /core/v1/users/me:
    put:
      tags:
        - Core - Users
      summary: Update Profil Pribadi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Naufal Akbar
                avatar:
                  type: string
                  example: https://images.unsplash.com/photo-user.jpg
      responses:
        "200":
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"

  /core/v1/users/change-password:
    post:
      tags:
        - Core - Users
      summary: Ganti Password Login
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

  # ============================================================================
  # CORE - ROLES & PERMISSIONS
  # ============================================================================
  /core/v1/roles:
    get:
      tags:
        - Core - Roles & Permissions
      summary: List Master Jabatan (Roles)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar roles berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"

  /core/v1/roles/{id}:
    get:
      tags:
        - Core - Roles & Permissions
      summary: Detail Role & Permissions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail role dengan daftar permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetailResponse"

  # ============================================================================
  # CORE - AUDIT LOGS
  # ============================================================================
  /core/v1/audit-logs:
    get:
      tags:
        - Core - Audit Logs
      summary: List Riwayat Audit Log (Tenant-Scoped)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: entity
          schema:
            type: string
            example: event
        - in: query
          name: action
          schema:
            type: string
            example: CREATE
      responses:
        "200":
          description: Riwayat audit log berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPaginatedResponse"

  # ============================================================================
  # MODULES - EVENTS & CATEGORIES
  # ============================================================================
/features/v1/events:
    get:
      tags:
        - Modules - Events
      summary: Katalog Event (Publik & Terfilter Tenant)
      description: "Menampilkan daftar event. Jika menyertakan tenant_id atau slug fakultas, akan menampilkan event khusus fakultas tersebut."
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
            format: uuid
          description: ID Fakultas / Rektorat
        - in: query
          name: category_id
          schema:
            type: string
            format: uuid
        - in: query
          name: event_type
          schema:
            type: string
            enum: [ONLINE, OFFLINE]
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, CLOSED, COMPLETED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Katalog event berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPaginatedResponse"
    post:
      tags:
        - Modules - Events
      summary: Buat Event Baru (Fakultas / Rektorat)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailResponse"

/features/v1/events/{id}:
    get:
      tags:
        - Modules - Events
      summary: Detail Event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail event ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags:
        - Modules - Events
      summary: Update Data Event
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Event berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailResponse"
    delete:
      tags:
        - Modules - Events
      summary: Hapus Event
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"

/features/v1/events/{slug}:
    get:
      tags:
        - Modules - Events
      summary: Detail Event by Slug Publik
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            example: seminar-dies-natalis-2026
      responses:
        "200":
          description: Detail event ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

/features/v1/event-categories:
    get:
      tags:
        - Modules - Event Categories
      summary: List Kategori Event
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
            format: uuid
          description: ID Fakultas / Rektorat
      responses:
        "200":
          description: Daftar kategori event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCategoryListResponse"

  # ============================================================================
  # FEATURES - REGISTRATIONS & ATTENDANCE
  # ============================================================================
  /features/v1/registrations:
    post:
      tags:
        - Features - Registrations
      summary: Daftar Ikut Event (Peserta)
      description: "Auto-approval (`REGISTERED`) untuk event gratis; event berbayar masuk status `WAITING_PAYMENT`. Kuota dikunci via `SELECT ... FOR UPDATE` untuk mencegah oversell."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
              properties:
                event_id:
                  type: string
                  format: uuid
                online_attendance:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Pendaftaran berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationDetailResponse"
        "404":
          description: Event tidak ditemukan atau tidak tersedia
        "409":
          description: Peserta sudah terdaftar (duplicate) atau kuota penuh
        "422":
          description: Pendaftaran ditutup (event bukan `PUBLISHED`) atau online attendance tidak tersedia

  /features/v1/registrations/me:
    get:
      tags:
        - Features - Registrations
      summary: Daftar Tiket Saya (Peserta)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [WAITING_PAYMENT, REGISTERED, CANCELLED, CHECKED_IN]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Daftar registrasi milik peserta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPaginatedResponse"

  /features/v1/registrations/{id}:
    delete:
      tags:
        - Features - Registrations
      summary: Batalkan Registrasi Saya (Peserta)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Registrasi berhasil dibatalkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "404":
          description: Registrasi tidak ditemukan atau bukan milik peserta

  /features/v1/registrations/event/{eventID}:
    get:
      tags:
        - Features - Registrations
      summary: List Registrasi per Event (Panitia / Organizer)
      description: "Root superadmin melihat lintas tenant; superadmin/panitia fakultas dibatasi tenant miliknya sendiri."
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: eventID
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [WAITING_PAYMENT, REGISTERED, CANCELLED, CHECKED_IN]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Daftar peserta event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPaginatedResponse"

  /features/v1/registrations/event/{eventID}/export:
    get:
      tags:
        - Features - Registrations
      summary: Ekspor Peserta Event ke Excel (Panitia / Organizer)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: eventID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File `.xlsx` daftar peserta
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /features/v1/attendances/scan:
    post:
      tags:
        - Features - Attendance
      summary: Scan QR Code Presensi Peserta
      description: >
        Khusus Scanner/Panitia/Superadmin dengan permission `attendance.scan`.
        Validasi atomik (`SELECT ... FOR UPDATE`) terhadap `qr_token` +
        `event_id`; panitia/scanner fakultas dibatasi tenant miliknya sendiri
        (root superadmin unscoped).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qr_token
                - event_id
              properties:
                qr_token:
                  type: string
                  example: valid-token-scan1-12345
                event_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Kehadiran berhasil diverifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceScanResponse"
        "400":
          description: Tiket belum lunas atau sudah dibatalkan (respons tetap menyertakan data peserta bila diketahui)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceScanResponse"
        "404":
          description: QR token tidak ditemukan atau tidak berlaku untuk event ini
        "409":
          description: Peserta sudah pernah check-in — respons menyertakan data peserta dan waktu scan pertama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceScanResponse"

  /features/v1/attendances/event/{eventID}/stats:
    get:
      tags:
        - Features - Attendance
      summary: Live Presence Dashboard — Statistik Kehadiran per Event
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: eventID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Statistik kehadiran event
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        format: uuid
                      total_registered:
                        type: integer
                        example: 120
                      total_checked_in:
                        type: integer
                        example: 87

  # ============================================================================
  # FEATURES - PAYMENTS (IPAYMU & MANUAL)
  # ============================================================================
  /features/v1/payments/checkout:
    post:
      tags:
        - Features - Payments
      summary: Buka Checkout Pembayaran (Peserta)
      description: >
        Merutekan checkout ke gateway iPaymu milik tenant penyelenggara event
        (via `tenant_payment_gateways`) — kredensial API key/VA satu tenant
        tidak pernah dipakai untuk tenant lain. Provider `MANUAL` melewati
        panggilan iPaymu dan langsung mengembalikan info rekening bank tenant.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_id
              properties:
                registration_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Checkout berhasil dibuka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetailResponse"
        "404":
          description: Registrasi tidak ditemukan atau gateway tenant belum dikonfigurasi
        "409":
          description: Registrasi sudah lunas
        "422":
          description: Registrasi tidak sedang menunggu pembayaran

  /features/v1/payments/webhook/ipaymu:
    post:
      tags:
        - Features - Payments
      summary: Webhook Notifikasi Pembayaran iPaymu
      description: >
        Dipanggil server-to-server oleh iPaymu (tanpa Bearer token). Payload
        webhook iPaymu TIDAK ditandatangani, jadi `trx_id` di body ini hanya
        dipakai sebagai kunci pencarian — status sebenarnya diverifikasi ulang
        via Check Transaction API iPaymu memakai kredensial tenant yang sama
        sebelum status pembayaran/registrasi diubah. `trx_id` tak dikenal
        diabaikan dengan 200 (tidak membocorkan informasi).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                trx_id:
                  type: string
                reference_id:
                  type: string
                status_code:
                  type: string
      responses:
        "200":
          description: Webhook diproses (termasuk saat trx_id tidak dikenal/diabaikan)
        "500":
          description: Gagal memverifikasi transaksi ke iPaymu (iPaymu boleh retry)

  /features/v1/payments/{id}/proof:
    post:
      tags:
        - Features - Payments
      summary: Unggah Bukti Transfer Manual (Peserta)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proof_url
              properties:
                proof_url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Bukti transfer berhasil disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "404":
          description: Payment tidak ditemukan, bukan milik peserta, atau bukan provider MANUAL

  /features/v1/payments/{id}/verify:
    post:
      tags:
        - Features - Payments
      summary: Verifikasi Bukti Transfer Manual (Panitia / Organizer)
      description: Root superadmin dapat verifikasi lintas tenant; panitia/superadmin fakultas dibatasi tenant miliknya sendiri.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve:
                  type: boolean
                note:
                  type: string
      responses:
        "200":
          description: Payment disetujui (PAID + registrasi diaktifkan) atau ditolak (FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "404":
          description: Payment tidak ditemukan atau di luar scope tenant panitia

  /features/v1/payments/registration/{registrationID}:
    get:
      tags:
        - Features - Payments
      summary: Lihat Status Pembayaran per Registrasi
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: registrationID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detail payment ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetailResponse"
        "404":
          description: Payment belum ada untuk registrasi ini

  # ============================================================================
  # FEATURES - CERTIFICATES
  # ============================================================================
  /features/v1/certificates/templates/event/{eventID}:
    get:
      tags: [Modules - Certificates]
      summary: Lihat Template Sertifikat Event
      security: [{BearerAuth: []}]
      parameters:
        - {in: path, name: eventID, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Template sertifikat event}
        "404": {description: Template atau event tidak ditemukan}
    put:
      tags: [Modules - Certificates]
      summary: Buat atau Perbarui Template Sertifikat
      security: [{BearerAuth: []}]
      parameters:
        - {in: path, name: eventID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number_template, number_mode]
              properties:
                background_url: {type: string, format: uri}
                number_template: {type: string, example: "CERT/{TENANT}/{SLUG}/{REG_NO}"}
                number_mode: {type: string, enum: [AUTO, MANUAL]}
                show_issued_date: {type: boolean}
                show_event_date: {type: boolean}
                show_event_location: {type: boolean}
                show_header: {type: boolean}
                header_text: {type: string}
                header_subtitle: {type: string}
                signatures:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    required: [name, signature_url]
                    properties:
                      name: {type: string}
                      title: {type: string}
                      signature_url: {type: string, format: uri}
                      order: {type: integer}
      responses:
        "200": {description: Template tersimpan}
        "422": {description: Template nomor tidak valid}

  /features/v1/certificates/event/{eventID}/generate:
    post:
      tags: [Modules - Certificates]
      summary: Antrekan Pembuatan Sertifikat Event
      description: Memproses peserta CHECKED_IN secara asinkron setelah event COMPLETED.
      security: [{BearerAuth: []}]
      parameters:
        - {in: path, name: eventID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                manual_numbers:
                  type: object
                  additionalProperties: {type: string}
      responses:
        "202": {description: Job pembuatan sertifikat masuk antrean}
        "409": {description: Job event masih aktif}
        "422": {description: Event atau peserta tidak memenuhi prasyarat}

  /features/v1/certificates/jobs/{id}:
    get:
      tags: [Modules - Certificates]
      summary: Lihat Status Job Pembuatan Sertifikat
      security: [{BearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Status dan progres job}
        "404": {description: Job tidak ditemukan}

  /features/v1/certificates/me:
    get:
      tags: [Modules - Certificates]
      summary: Daftar Sertifikat Peserta yang Login
      security: [{BearerAuth: []}]
      responses:
        "200": {description: Daftar sertifikat peserta}

  /features/v1/certificates/verify/{identifier}:
    get:
      tags:
        - Modules - Certificates
      summary: Verifikasi Sertifikat Publik
      description: Halaman verifikasi publik keaslian sertifikat peserta tanpa perlu login.
      parameters:
        - in: path
          name: identifier
          required: true
          schema:
            type: string
            description: ID atau nomor sertifikat
      responses:
        "200":
          description: Data sertifikat valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateVerifyResponse"
        "404":
          description: Sertifikat tidak ditemukan

  # ============================================================================
  # FEATURES - CONTENT (ARTICLES, CATEGORIES, GALLERIES)
  # ============================================================================
  /features/v1/articles:
    get:
      tags:
        - Features - Content
      summary: List Artikel (Publik)
      description: Menampilkan artikel global (tenant_id NULL / tenant ROOT) beserta artikel milik tenant tertentu bila `tenant_id` disertakan.
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Daftar artikel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Article"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags:
        - Features - Content
      summary: Buat Artikel Baru (Panitia/Superadmin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleRequest"
      responses:
        "201":
          description: Artikel berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  data:
                    $ref: "#/components/schemas/Article"

  /features/v1/articles/by-slug/{slug}:
    get:
      tags:
        - Features - Content
      summary: Detail Artikel by Slug (Publik)
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail artikel ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Article"
        "404":
          description: Artikel tidak ditemukan

  /features/v1/articles/{id}:
    put:
      tags:
        - Features - Content
      summary: Perbarui Artikel
      description: Superadmin/panitia fakultas dibatasi mengubah artikel milik tenant-nya sendiri; root superadmin unscoped.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleRequest"
      responses:
        "200":
          description: Artikel berhasil diperbarui
        "403":
          description: Tidak memiliki permission `articles.update`
        "404":
          description: Artikel tidak ditemukan atau di luar scope tenant
    delete:
      tags:
        - Features - Content
      summary: Hapus Artikel
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artikel berhasil dihapus
        "404":
          description: Artikel tidak ditemukan atau di luar scope tenant

  /features/v1/article-categories:
    get:
      tags:
        - Features - Content
      summary: List Kategori Artikel (Publik)
      responses:
        "200":
          description: Daftar kategori artikel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArticleCategory"
    post:
      tags:
        - Features - Content
      summary: Buat Kategori Artikel Baru
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Prestasi Kampus
      responses:
        "201":
          description: Kategori berhasil dibuat

  /features/v1/article-categories/{id}:
    put:
      tags:
        - Features - Content
      summary: Perbarui Kategori Artikel
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Kategori berhasil diperbarui
        "404":
          description: Kategori tidak ditemukan
    delete:
      tags:
        - Features - Content
      summary: Hapus Kategori Artikel
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kategori berhasil dihapus
        "404":
          description: Kategori tidak ditemukan

  /features/v1/galleries:
    get:
      tags:
        - Features - Content
      summary: List Galeri (Publik)
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
            format: uuid
        - in: query
          name: event_id
          schema:
            type: string
            format: uuid
        - in: query
          name: featured
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Daftar galeri
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Gallery"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags:
        - Features - Content
      summary: Tambah Foto Galeri
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryRequest"
      responses:
        "201":
          description: Galeri berhasil ditambahkan

  /features/v1/galleries/{id}:
    put:
      tags:
        - Features - Content
      summary: Perbarui Foto Galeri
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryRequest"
      responses:
        "200":
          description: Galeri berhasil diperbarui
        "404":
          description: Galeri tidak ditemukan atau di luar scope tenant
    delete:
      tags:
        - Features - Content
      summary: Hapus Foto Galeri
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Galeri berhasil dihapus
        "404":
          description: Galeri tidak ditemukan atau di luar scope tenant

  # ============================================================================
  # FEATURES - SUPPORT MESSAGES
  # ============================================================================
  /features/v1/support-messages:
    post:
      tags:
        - Features - Support
      summary: Kirim Pesan Bantuan (Publik)
      description: >
        Endpoint publik tanpa autentikasi (form "hubungi kami"). `user_id`
        sengaja tidak pernah diterima dari klien untuk mencegah seseorang
        melampirkan keluhan ke akun orang lain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - phone
                - name
                - title
                - category
                - chronology
              properties:
                tenant_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                phone:
                  type: string
                name:
                  type: string
                title:
                  type: string
                category:
                  type: string
                chronology:
                  type: string
      responses:
        "201":
          description: Pesan berhasil dikirim, status awal PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  data:
                    $ref: "#/components/schemas/SupportMessage"
    get:
      tags:
        - Features - Support
      summary: List Pesan Bantuan (Panitia/Superadmin)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, IN_PROGRESS, RESOLVED, REJECTED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Daftar pesan bantuan (ter-scope tenant panitia; root superadmin unscoped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportMessage"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /features/v1/support-messages/{id}/status:
    patch:
      tags:
        - Features - Support
      summary: Perbarui Status Pesan Bantuan
      description: >
        Hanya mengubah status transisi (PENDING/IN_PROGRESS/RESOLVED/REJECTED)
        — skema belum memiliki kolom balasan tertulis.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, IN_PROGRESS, RESOLVED, REJECTED]
      responses:
        "200":
          description: Status berhasil diperbarui
        "404":
          description: Pesan tidak ditemukan atau di luar scope tenant

# ==============================================================================
# COMPONENTS & SCHEMAS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan access token JWT dengan prefix 'Bearer <token>'

  responses:
    BadRequestError:
      description: Request tidak valid atau validasi schema gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Token otentikasi tidak disediakan atau tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Pengguna tidak memiliki izin / hak akses ke resource ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource yang diminta tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: "Terjadi konflik data (contoh: email atau slug sudah digunakan)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ─── Standard Envelopes ───────────────────────────────────────────────────
    BaseResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Operasi berhasil dilakukan

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Validasi gagal
        errors:
          type: array
          items:
            type: string
          example: ["email format is invalid"]

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 5

    # ─── Auth Schemas ─────────────────────────────────────────────────────────
    SignUpRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Budi Pratama
        email:
          type: string
          format: email
          example: budi.pratama@gmail.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: superadmin.univ@untitled.ac.id
        password:
          type: string
          format: password
          example: password

    SwitchTenantRequest:
      type: object
      required:
        - tenant_slug
      properties:
        tenant_slug:
          type: string
          example: fasilkom
          description: Slug tenant fakultas tujuan beralih konteks

    TokenResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Token refreshed successfully
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refresh_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthSuccessResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Login berhasil
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refresh_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              $ref: "#/components/schemas/User"
            tenant:
              $ref: "#/components/schemas/Tenant"

    MeSuccessResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            tenant:
              $ref: "#/components/schemas/Tenant"
            permissions:
              type: array
              items:
                type: string
              example: ["events.read", "events.create", "payments.verify"]

    # ─── Tenant Schemas ───────────────────────────────────────────────────────
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c9711506-d356-4704-a32e-0543dfe3e104
        name:
          type: string
          example: Fakultas Ilmu Komputer
        slug:
          type: string
          example: fasilkom
        code:
          type: string
          example: FASILKOM
        type:
          type: string
          enum: [ROOT, FACULTY, DEPARTMENT, UNIT]
          example: FACULTY
        parent_id:
          type: string
          format: uuid
          nullable: true
        website:
          type: string
          example: https://cs.untitled.ac.id
        description:
          type: string
          example: Fakultas Ilmu Komputer & Teknologi Informasi
        settings:
          type: object
          example:
