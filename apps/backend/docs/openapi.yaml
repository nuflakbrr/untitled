        slug:
          type: string
          example: workshop
        description:
          type: string

    EventCategoryListResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventCategory"

    # ─── Registration & Attendance Schemas ───────────────────────────────────
    Registration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
          example: Seminar Dies Natalis 2026
        event_slug:
          type: string
          example: seminar-dies-natalis-2026
        tenant_id:
          type: string
          format: uuid
        tenant_code:
          type: string
          example: FASILKOM
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
          example: Peserta Scan 1
        user_email:
          type: string
          format: email
        registration_number:
          type: string
          example: REG-UMN-SEMINAR-DIES-NATALIS-2026-2026-00001
        qr_token:
          type: string
          example: valid-token-scan1-12345
        online_attendance:
          type: boolean
        status:
          type: string
          enum: [WAITING_PAYMENT, REGISTERED, CANCELLED, CHECKED_IN]
        price:
          type: integer
          format: int64
          example: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    RegistrationPaginatedResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: "#/components/schemas/Registration"
