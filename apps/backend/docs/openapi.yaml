        slug:
          type: string
          example: fk
        code:
          type: string
          example: FK
        type:
          type: string
          enum: [FACULTY, DEPARTMENT, UNIT]
          example: FACULTY
        parent_id:
          type: string
          format: uuid
          nullable: true
        website:
          type: string
          example: https://fk.untitled.ac.id
        description:
          type: string
          example: Fakultas Kedokteran dan Ilmu Kesehatan
        settings:
          type: object
          example:
            themeColor: "#10B981"

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
        description:
          type: string
