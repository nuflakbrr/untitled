          type: string
          example: webinar-desain-ui-ux-fasilkom
        description:
          type: string
        banner:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        start_time:
          type: string
          example: "09:00"
        end_time:
          type: string
          example: "12:00"
        location:
          type: string
        event_type:
          type: string
          enum: [ONLINE, OFFLINE]
        online_attendance:
          type: boolean
        registration_deadline:
          type: string
          format: date-time
        quota:
          type: integer
          example: 100
        price:
          type: integer
          example: 0
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CLOSED, COMPLETED]
        certificate_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEventRequest:
      type: object
      required:
        - title
        - description
        - start_date
        - end_date
        - start_time
        - end_time
        - location
        - event_type
        - quota
        - price
        - registration_deadline
      properties:
        tenant_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        banner:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        start_time:
          type: string
        end_time:
          type: string
        location:
          type: string
        meeting_link:
          type: string
        event_type:
          type: string
          enum: [ONLINE, OFFLINE]
        online_attendance:
          type: boolean
        registration_deadline:
          type: string
          format: date-time
        quota:
          type: integer
        price:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        certificate_enabled:
          type: boolean

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        quota:
          type: integer
        price:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, CLOSED, COMPLETED]

    EventPaginatedResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    EventDetailResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/Event"

    EventCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
