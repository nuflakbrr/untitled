              type: string
              format: uuid
            registration_number:
              type: string
              example: REG-UMN-SEMINAR-DIES-NATALIS-2026-2026-00001
            participant_name:
              type: string
              example: Peserta Scan 1
            participant_email:
              type: string
              format: email
            event_id:
              type: string
              format: uuid
            event_title:
              type: string
              example: Seminar Dies Natalis 2026
            scan_time:
              type: string
              format: date-time
            status:
              type: string
              enum: [SUCCESS, FAILED]

