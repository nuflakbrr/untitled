          type: boolean
        api_key:
          type: string
        virtual_account:
          type: string
        env:
          type: string
          enum: [sandbox, production]
        bank_name:
          type: string
        bank_account_number:
          type: string
        bank_account_holder:
          type: string

    # ─── User Schemas ─────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 48e8167e-0105-4242-b6db-9bb12dc84bce
        tenant_id:
          type: string
          format: uuid
          nullable: true
          example: c9711506-d356-4704-a32e-0543dfe3e104
        email:
          type: string
          format: email
          example: superadmin.fasilkom@untitled.ac.id
        name:
          type: string
          example: Superadmin FASILKOM
        role:
          type: string
          example: superadmin
        role_id:
          type: string
          format: uuid
        email_verified:
          type: boolean
          example: true
        banned:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - password
        - role
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [superadmin, panitia, scanner, peserta]
        tenant_id:
          type: string
          format: uuid
          nullable: true

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [superadmin, panitia, scanner, peserta]
        tenant_id:
          type: string
          format: uuid
          nullable: true

    BanUserRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: Melanggar ketentuan etika universitas
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Tanggal kadaluarsa ban (kosongkan untuk ban permanen)

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
