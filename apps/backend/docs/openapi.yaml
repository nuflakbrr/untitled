          $ref: "#/components/schemas/PaginationMeta"

    UserDetailResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        data:
          $ref: "#/components/schemas/User"

    # ─── Role Schemas ─────────────────────────────────────────────────────────
    Role:
      type: object
      properties:
        id:
