# ──────────────────────────────────────────────────────────────────────────────
# SITIVENT Monorepo CI Pipeline
# Runs on every push and pull request targeting `main` or `develop` branches.
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend: Build + Unit Tests (Go)
  # ────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: 🔵 Backend — Go Build & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    env:
      JWT_SECRET: ci-test-super-secret-key-at-least-32-characters!
      JWT_EXPIRATION: 1h
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run unit tests with race detector
        run: go test -v -race -count=1 -timeout=120s ./...

      - name: Generate coverage report
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.out
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend: TypeScript type-checking + Lint
  # ────────────────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: 🟡 Frontend — TypeScript Check & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run tsc:check
        continue-on-error: false

      - name: Lint
        run: bun run lint
        continue-on-error: true
